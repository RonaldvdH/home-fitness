name: Release Tag

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history & tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compute next SemVer tag from Conventional Commit
        id: semver
        shell: bash
        run: |
          EXISTING_TAG=$(git tag --points-at HEAD --list 'v*.*.*' | head -n 1)
          if [ -n "$EXISTING_TAG" ]; then
            echo "HEAD is already tagged ($EXISTING_TAG); skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT_TAG=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n 1)
          CURRENT_TAG="${CURRENT_TAG:-v0.0.0}"
          COMMIT_MSG=$(git log -1 --pretty=%B)

          node scripts/semver.mjs next \
            --current "$CURRENT_TAG" \
            --message "$COMMIT_MSG" \
            --github-output "$GITHUB_OUTPUT"

      - name: Create annotated git tag and GitHub Release
        if: steps.semver.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: ${{ steps.semver.outputs.current_tag }}
          NEXT_TAG: ${{ steps.semver.outputs.next_tag }}
          SUBJECT: ${{ steps.semver.outputs.subject }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$NEXT_TAG" -m "Release $NEXT_TAG: $SUBJECT"
          git push origin "$NEXT_TAG"

          if [ "$CURRENT_TAG" != "v0.0.0" ] && git rev-parse -q --verify "refs/tags/$CURRENT_TAG" >/dev/null; then
            gh release create "$NEXT_TAG" \
              --title "$NEXT_TAG — $SUBJECT" \
              --generate-notes \
              --notes-start-tag "$CURRENT_TAG"
          else
            gh release create "$NEXT_TAG" \
              --title "$NEXT_TAG — $SUBJECT" \
              --generate-notes
          fi
