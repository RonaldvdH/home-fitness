name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify before deploy
        run: |
          pnpm typecheck
          pnpm lint
          pnpm fmt:check
          pnpm test

      - name: Resolve live app version
        id: version
        shell: bash
        run: |
          EXACT_TAG=$(git tag --points-at HEAD --list 'v*.*.*' | head -n 1)
          if [ -n "$EXACT_TAG" ]; then
            echo "app_version=$EXACT_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CURRENT_TAG=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n 1)
          CURRENT_TAG="${CURRENT_TAG:-v0.0.0}"
          COMMIT_MSG=$(git log -1 --pretty=%B)
          NEXT_TAG=$(node -e "import('./scripts/semver.mjs').then(m => console.log(m.computeNextVersion(process.argv[1], process.argv[2]).next))" "$CURRENT_TAG" "$COMMIT_MSG")
          echo "app_version=$NEXT_TAG" >> "$GITHUB_OUTPUT"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build for GitHub Pages
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          pnpm build
          pnpm check:budget

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
